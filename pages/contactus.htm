<section id="contactus" class="my-20 bg-gray-100 py-16">
    <div class="contact max-w-[1000px] mx-auto flex flex-col xl:flex-row items-center justify-between gap-5 m-5 px-5">
        <div class="form w-full max-w-lg">
            <h2 class="text-4xl font-bold">Contact Us</h2>
            <form action="" class="flex flex-col items-center gap-5">
                <input type="text" placeholder="Name"
                    class="w-full py-2 border-b border-gray-400 outline-none focus:border-[#FC5D35]">
                <input type="tel" placeholder="Phone Number"
                    class="w-full py-2 border-b border-gray-400 outline-none focus:border-[#FC5D35]">
                <input type="email" placeholder="Email"
                    class="w-full py-2 border-b border-gray-400 outline-none focus:border-[#FC5D35]">
                <textarea placeholder="Message"
                    class="w-full py-2 border-b border-gray-400 outline-none focus:border-[#FC5D35]"></textarea>
                <button class="bg-[#FC5D35] text-white py-1 px-8 cursor-pointer">SEND</button>
            </form>
        </div>
        <div class="contactimage">
            <img src="img/orange-dish.png" alt="contact photo">
        </div>
    </div>
</section>
